<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 56" width="1200" height="56" role="img" aria-label="">
<style>
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes up{from{transform:translateY(115%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes mq{to{transform:translateX(var(--mq))}}
@keyframes star{0%,100%{opacity:.15}50%{opacity:.9}}
.t1{animation:tw 3.2s ease-in-out infinite}
.t2{animation:tw 4.6s ease-in-out .8s infinite}
.t3{animation:tw 6s ease-in-out 1.6s infinite}
.fl{animation:fl 8s ease-in-out infinite}
.pin{transform-box:fill-box;transform-origin:center}
.pin>g{animation-fill-mode:both}
.rv{transform-box:fill-box;animation:up 1.1s cubic-bezier(.16,1,.3,1) both}
.fd{animation:fade 1s cubic-bezier(.16,1,.3,1) both}
.st{animation:star 4s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes shoot{0%{opacity:0;transform:translate(0,0)}4%{opacity:1}22%{opacity:0;transform:translate(-360px,200px)}100%{opacity:0;transform:translate(-360px,200px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.sh{animation:shoot 9s ease-in infinite}
.bl{animation:blink 2.4s ease-in-out infinite}
.dr{animation:drift 7s ease-in-out infinite}
</style>
<defs>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff" stop-opacity="0"/><stop offset=".5" stop-color="#7c5cff" stop-opacity=".55"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
<radialGradient id="pl" cx="35%" cy="30%"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#7c5cff"/></radialGradient>
</defs>
